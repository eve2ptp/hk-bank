name: Build rule-set

on:
  push:
    branches:
      - main
    paths:
      - "hk-bank.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-srs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install sing-box (latest)
        run: |
          asset=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | jq -r '.assets[].browser_download_url' | grep -E 'linux-amd64\.tar\.gz$' | head -n1)
          echo "Downloading $asset"
          curl -fsSL -o /tmp/sing-box.tar.gz "$asset"
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo install -m 755 /tmp/sing-box-*/sing-box /usr/local/bin/sing-box
          sing-box version

      - name: Compile rule-set
        run: sh compile-hk-bank-srs.sh

      - name: Commit hk-bank.srs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet hk-bank.srs; then
            git add hk-bank.srs
            git commit -m "chore: rebuild hk-bank.srs"
            git push
          else
            echo "hk-bank.srs is up to date"
          fi
